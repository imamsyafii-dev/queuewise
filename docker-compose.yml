services:
  postgres:
    image: postgres:16-alpine
    container_name: queuewise-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: queuewise
      POSTGRES_PASSWORD: queuewise_secret
      POSTGRES_DB: queuewise
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: queuewise-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
